[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-factory"
version = "0.2.0"
description = "Personal software factory for solo engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
forge = "forge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
